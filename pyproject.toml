[project]
name = "dynamic-markdown"
version = "0.2.1"
description = "An enhanced markdown file format whose content can be defined dynamically by tags."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "docformatter",
    "pytest",
    "ruff",
]

[build-system]
requires = ["uv_build>=0.11.11,<0.12"]
build-backend = "uv_build"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["D", "DOC"]

[tool.ruff.lint.pydocstyle]
convention = "google"
