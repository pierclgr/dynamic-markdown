[project]
name = "dynamic-markdown"
version = "0.1.0"
description = "An enhanced markdown file format whose content can be defined dynamically by tags."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "docformatter",
    "pytest",
    "ruff",
]

[tool.uv]
package = false

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["D", "DOC"]

[tool.ruff.lint.pydocstyle]
convention = "google"
